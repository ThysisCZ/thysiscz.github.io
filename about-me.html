<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thysis | About Me</title>
    <link href="styles.css" rel="stylesheet" />
    <link href="assets/favicon.ico" rel="icon" />
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        $(function () {
            $("#menu-container").load("menu.html", function () {
                // Get current page filename
                const path = window.location.pathname;
                const page = path.substring(path.lastIndexOf('/') + 1) || "index.html";

                // Add active class to the matching link
                $("#tab-container a").each(function () {
                    const href = $(this).attr("href");
                    if (href === page) {
                        $(this).addClass("active");
                    }
                });
            });
        });
    </script>
</head>

<body>
    <div id="page-container">
        <div id="banner-wrapper">
            <img id="banner" src="assets/banner.png" alt="Banner">
        </div>
        <div id="menu-container"></div>
        <div class="text-large" style="margin: 15px 0px 20px 40px">
            About Me
        </div>
        <div class="text-medium" style="margin: 0px 0px 25px 40px">
            Basic Info
        </div>
        <div id="basic-info">
            <div>
                <img id="profile-photo" src="./assets/profile-photo.jpg">
            </div>
            <div class="text-small">
                <p>
                    I'm a <b>software developer</b> and mostly use
                    <br>
                    JavaScript, Python and C for my projects.
                </p>
                <p>
                    I've also been making music since 2021 and
                    <br>
                    currently focus on remixing tracks from the
                    <br>
                    <b>
                        <a class="ext-link" href="https://en.touhouwiki.net/wiki/Touhou_Wiki">
                            Touhou Project</a>
                    </b>
                    series.
                </p>
            </div>
        </div>
        <div class="text-medium" style="margin: 15px 0px 15px 40px">
            Contact
        </div>
        <div class="text-small" style="margin: 0px 0px 40px 40px">
            <b>Email:</b> jirithysiskerner@gmail.com
        </div>
    </div>
</body>

</html>
