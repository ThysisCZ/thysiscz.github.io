<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thysis | Home</title>
    <link href="styles.css" rel="stylesheet" />
    <link href="assets/favicon.ico" rel="icon" />
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        $(function () {
            $("#menu-container").load("menu.html", function () {
                // Get current page filename
                const path = window.location.pathname;
                const page = path.substring(path.lastIndexOf('/') + 1) || "index.html";

                // Add active class to the matching link
                $("#tab-container a").each(function () {
                    const href = $(this).attr("href");
                    if (href === page) {
                        $(this).addClass("active");
                    }
                });
            });
        });
    </script>
    <script>
        window.addEventListener('load', () => {
            document.querySelector('.gif-track').classList.add('animate');
        });
    </script>
</head>

<body>
    <div id="page-container">
        <div id="banner-wrapper">
            <img id="banner" src="assets/banner.png" alt="Banner">
        </div>
        <div id="menu-container"></div>
        <div id="home-page">
            <div class="text-large">
                <p>
                    Hello, I'm <span style="color: lightskyblue">Thysis</span>.
                    <br>
                    Welcome to my website!
                </p>
            </div>
            <div class="gif-marquee">
                <div class="gif-track">
                    <img src="assets/bad-apple.gif" alt="">
                    <img src="assets/reisen.gif" alt="">
                    <img src="assets/sakuya.gif" alt="">
                    <img src="assets/yuyuko.gif" alt="">
                    <img src="assets/pixels.gif" alt="">
                    <img src="assets/terminal.gif" alt="">
                    <img src="assets/music.gif" alt="">
                    <img src="assets/glitch-cat.gif" alt="">
                    <img src="assets/atari.gif" alt="">
                    <img src="assets/isometric.gif" alt="">
                    <img src="assets/nyan-cat.gif" alt="">
                    <img src="assets/cat-meme.gif" alt="">
                    <img src="assets/internet-waves.gif" alt="">
                    <img src="assets/vaporwave.gif" alt="">
                </div>
            </div>
            <div>
                <img style="width: 125px" src="assets/cat-wave.gif">
            </div>
        </div>
    </div>
</body>

</html>
